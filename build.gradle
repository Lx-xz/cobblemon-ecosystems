plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = 'com.luiz.cobblemonecosystems'
base { archivesName = project.archives_base_name }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.impactdev.net/repository/development/' } // Cobblemon
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }     // Kotlin for Forge (dependência do Cobblemon)
    // Mods do Modrinth (só os de performance, para o jogo de teste)
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            // Nome do jogador no jogo de teste (servidor offline aceita qualquer nome).
            programArguments.addAll('--username', 'Luiz')
        }
        server { server() }
        // Sobe o jogo sem janela e sem EULA, só para conferir se mods e mixins carregam.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            // Salva em run-gametest/.mixin.out as classes alteradas pelos mixins, para conferir.
            jvmArgument '-Dmixin.debug.export=true'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

dependencies {
    // Cobblemon para compilar e para rodar no runClient/runServer.
    implementation("com.cobblemon:neoforge:${project.cobblemon_version}") { transitive = false }
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:2.0.0'
    // Kotlin for Forge: o Cobblemon precisa dele para carregar no runClient/runServer.
    runtimeOnly 'thedarkcolour:kotlinforforge-neoforge:5.12.0'

    // Performance no runClient (não vão dentro do jar do mod). Ids exatos das versões no Modrinth.
    // Vêm do Modrinth, que algumas redes bloqueiam: nesse caso rode com -Pperf_mods=false
    // (ou mude perf_mods no gradle.properties) para o runClient subir sem eles.
    if (project.perf_mods.toBoolean()) {
        runtimeOnly 'maven.modrinth:sodium:uMOpc5uV'        // mc1.21.1-0.8.13-neoforge: renderização
        runtimeOnly 'maven.modrinth:lithium:DDUrRVCA'       // mc1.21.1-0.15.4-neoforge: lógica do servidor
        runtimeOnly 'maven.modrinth:ferrite-core:x7kQWVju'  // 7.0.3-neoforge: memória
        runtimeOnly 'maven.modrinth:modernfix:5HLHxQ2F'     // 5.27.24+mc1.21.1: carregamento e memória
        runtimeOnly 'maven.modrinth:entityculling:8w8FfUPs' // 1.11.2: não desenha entidades escondidas
    }

    // Mods para testar no runClient (não vão dentro do jar do mod). Também vêm do Modrinth: -Ptest_mods=false desliga.
    if (project.test_mods.toBoolean()) {
        runtimeOnly 'maven.modrinth:effortless-building:YxnBXtLv' // 4.2+1.21.1: construir rápido (montar habitats)
    }
}

processResources {
    def props = [mod_id: project.mod_id, mod_version: project.mod_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Apaga jars de versões antigas antes de gerar o novo: o compat (../hollows_chasms_cavities) carrega
// qualquer cobblemon-ecosystems-*.jar daqui, e duas versões juntas não carregam.
tasks.named('jar') {
    doFirst { delete fileTree(destinationDirectory) { include "${project.archives_base_name}-*.jar" } }
}

// Repassa o teclado para o console do runServer (sem isso não dá para digitar comandos nele).
tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }
