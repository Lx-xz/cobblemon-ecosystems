modLoader = "javafml"
loaderVersion = "[4,)"
license = "MPL-2.0"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Cobblemon Ecosystems"
authors = "luiz"
description = '''
Pokémon become the wildlife of the world: they replace vanilla animals and live alongside Minecraft's inhabitants.
Trader Mudbray with a blanket, village pens with Pokémon, Golett and Golurk guardians, villagers with Pokémon
partners, Combee hives and dog Pokémon hunting skeletons.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cobblemon"
type = "required"
versionRange = "[1.8,)"
ordering = "AFTER"
side = "BOTH"
